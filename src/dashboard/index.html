<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rawstor Benchmark Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script type="importmap">{ "imports": { "d3": "https://cdn.jsdelivr.net/npm/d3@7/+esm" }}</script>
  <script>
    // Start fetching chart data as early as possible — in parallel with
    // bundle.js and d3 — so rendering begins as soon as all three are ready
    // instead of waiting for the script chain to finish first.
    // Consumed once by the data loader; the Refresh button issues its own fetch.
    window.__rawstorDataPreload = fetch('./data.json');
  </script>
</head>
<body>
  <main id="app">
    <div class="loading" role="status" aria-live="polite">
      <div class="loading-spinner"></div>
      <p>Loading dashboard data...</p>
    </div>
  </main>
  <script type="module" src="bundle.js"></script>
</body>
</html>
