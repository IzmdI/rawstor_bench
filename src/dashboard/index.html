<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rawstor Benchmark Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <script>
    // Fetch chart data while the browser loads the dashboard bundle.
    // Consumed once by the data loader; the Refresh button issues its own fetch.
    window.__rawstorDataPreload = fetch('./data.json');
  </script>
</head>
<body>
  <main id="app">
    <div class="loading" role="status" aria-live="polite">
      <div class="loading-spinner"></div>
      <p>Loading dashboard data...</p>
    </div>
  </main>
  <script type="module" src="bundle.js"></script>
</body>
</html>
