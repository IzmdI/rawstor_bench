name: Dashboard Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test benchmark tools
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Generate benchmark detail pages
        run: python3 tools/rawstor-bench-compile --prefix . fio

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Test and build dashboard
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build
