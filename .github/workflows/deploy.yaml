name: Deploy Dashboard

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Test benchmark tools
        run: python3 -m unittest discover -s tests -p "test_*.py"

      - name: Generate benchmark detail pages
        run: python3 tools/rawstor-bench-compile --prefix . fio

      - name: Process data
        run: python3 tools/data-processor 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Build dashboard
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: './docs'
          destination: './_site'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
